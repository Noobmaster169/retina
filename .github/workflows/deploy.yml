name: Build & Publish

# The frontend is on Vercel, which builds and deploys frontend/ itself from
# this repo's main branch (Git integration, root directory "frontend"). This
# workflow covers the backend: publish its image to GHCR, gated on both
# packages type-checking, the backend suite passing against a real Postgres,
# the frontend building, and the proxy's tests.
#
# The gates also run on a pull request, which is the only way to see this
# workflow go green before it decides whether main is publishable.
#
# The Monash box deploys the backend on its own: auto-deploy.sh pulls (or
# builds) the image on a cron, because GitHub runners cannot reach the
# university network. The deploy scripts themselves are exercised by
# deploy/sim, not here: they need a Docker daemon laid out like the box.
# See deploy/README.md.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.workflow }}-${{ github.ref }}
  # A superseded pull request check is wasted work; a superseded publish is not.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io

jobs:
  # Gates the publish. The image build does not type-check, so this is the
  # only thing catching that.
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          # The action reads packageManager from a root package.json, which
          # this monorepo does not have. Keep in step with frontend/ and
          # backend/ package.json.
          version: 11.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            backend/pnpm-lock.yaml

      # --frozen-lockfile fails fast if package.json and pnpm-lock.yaml have
      # drifted, rather than silently resolving something new.
      - name: Install (frontend)
        run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Install (backend)
        run: pnpm install --frozen-lockfile
        working-directory: backend

      - name: Type-check (frontend)
        # Runs `next typegen` first: PageProps/LayoutProps are globals Next
        # generates into .next/types, which a fresh checkout does not have.
        run: pnpm type-check
        working-directory: frontend
      - name: Type-check (backend)
        run: pnpm type-check
        working-directory: backend

      - name: Lint (frontend)
        run: pnpm lint
        working-directory: frontend

      # Vercel builds the frontend on its own, after this workflow has already
      # decided the backend is publishable. Building here is what stops a
      # server component that only breaks at build time from reaching main.
      - name: Build (frontend)
        run: pnpm build
        working-directory: frontend
        env:
          # No page fetches at build time (every route is force-dynamic), but
          # api-client.ts throws on import without these.
          BACKEND_URL: http://127.0.0.1:8091
          API_SHARED_SECRET: build-only-not-a-secret

  # The repository and route tests need a real Postgres. Everything else the
  # backend talks to (Redis, MinIO, the inbox, the llm-proxy) has a fake, so
  # this is the only service the suite needs.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: localdev
        # 5433, and the postgres superuser: the values in backend/vitest.config.ts,
        # which point at compose.local.yaml on a dev machine.
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Install (backend)
        run: pnpm install --frozen-lockfile
        working-directory: backend
      - name: Test (backend)
        # Global setup creates retina_test in that instance and migrates it.
        run: pnpm test
        working-directory: backend

  proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: proxy/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
        working-directory: proxy
      - name: Lint
        run: ruff check .
        working-directory: proxy
      - name: Test
        run: pytest -q
        working-directory: proxy
      # The box builds this image from the clone on deploy; a Dockerfile that
      # cannot build should fail here, not on a box nobody can SSH into.
      - name: Build the llm-proxy image
        run: docker build -t retina-llm-proxy proxy
      - name: The image carries the pinned claude CLI and serves its aliases
        run: |
          docker run --rm retina-llm-proxy claude --version
          docker run -d --name probe -p 127.0.0.1:4010:4000 retina-llm-proxy
          for _ in $(seq 1 20); do curl -fsS 127.0.0.1:4010/healthz && break; sleep 1; done
          curl -fsS 127.0.0.1:4010/v1/models | grep -q '"sonnet"'
          docker rm -f probe

  # score.ts is a hand port of the organisers' scoring.py, which this repo does
  # not control. parity.ts is the only thing that proves they still agree, and
  # until now it only ran when someone remembered to run it.
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install (backend)
        run: pnpm install --frozen-lockfile
        working-directory: backend
      - name: Scorer parity
        run: pnpm eval:parity
        working-directory: backend
        env:
          # The answer key is already in the checkout: it ships with the
          # organiser kit. Nothing here reaches Postgres, but config.ts
          # validates the whole environment before any script runs.
          EVAL_GROUND_TRUTH_PATH: ../emails/data_v2/ground_truth.json
          PG_HOST: unused
          PG_DATABASE: unused
          PG_USER: unused
          PG_PASSWORD: unused
          EMAIL_SERVER_URL: http://127.0.0.1:8080

  # Publishes ghcr.io/<owner>/retina-api. The moving :main tag is what the
  # Monash compose file names; the immutable tag is for pinning a rollback.
  # Pull requests stop at the gates above: nothing they run may publish.
  build-api:
    needs: [quality, test, proxy, parity]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set image tags
        id: tag
        # run_number keeps re-runs of the same SHA unique.
        run: |
          echo "immutable=${GITHUB_SHA::12}-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "moving=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Resolve image name
        id: img
        # GHCR rejects uppercase; this owner's login has capitals.
        run: echo "name=${REGISTRY}/${REPO,,}-api" >> "$GITHUB_OUTPUT"
        env:
          REGISTRY: ${{ env.REGISTRY }}
          REPO: ${{ github.repository }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build & push image
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:${{ steps.tag.outputs.immutable }}
            ${{ steps.img.outputs.name }}:${{ steps.tag.outputs.moving }}
          cache-from: type=gha,scope=api-${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=api-${{ github.ref_name }}
