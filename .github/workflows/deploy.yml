name: Build & Publish

# The frontend is on Vercel, which builds and deploys frontend/ itself from
# this repo's main branch (Git integration, root directory "frontend"). This
# workflow covers the backend: publish its image to GHCR, gated on the
# frontend and backend type-checking and the proxy's tests, so a broken commit
# is visible here too.
#
# The Monash box deploys the backend on its own: auto-deploy.sh pulls (or
# builds) the image on a cron — GitHub runners cannot reach the university
# network. See deploy/README.md.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  # Gates the publish. The image build does not type-check, so this is the
  # only thing catching that.
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            backend/pnpm-lock.yaml

      # --frozen-lockfile fails fast if package.json and pnpm-lock.yaml have
      # drifted, rather than silently resolving something new.
      - name: Install (frontend)
        run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Install (backend)
        run: pnpm install --frozen-lockfile
        working-directory: backend

      - name: Type-check (frontend)
        # Runs `next typegen` first: PageProps/LayoutProps are globals Next
        # generates into .next/types, which a fresh checkout does not have.
        run: pnpm type-check
        working-directory: frontend
      - name: Type-check (backend)
        run: pnpm type-check
        working-directory: backend

      - name: Lint (frontend)
        run: pnpm lint
        working-directory: frontend


  proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: proxy/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
        working-directory: proxy
      - name: Test
        run: pytest -q
        working-directory: proxy

  # Publishes ghcr.io/<owner>/retina-api. The moving :main tag is what the
  # Monash compose file pulls; the immutable tag is for pinning a rollback.
  build-api:
    needs: [quality, proxy]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set image tags
        id: tag
        # run_number keeps re-runs of the same SHA unique.
        run: |
          echo "immutable=${GITHUB_SHA::12}-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "moving=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Resolve image name
        id: img
        # GHCR rejects uppercase; this owner's login has capitals.
        run: echo "name=${REGISTRY}/${REPO,,}-api" >> "$GITHUB_OUTPUT"
        env:
          REGISTRY: ${{ env.REGISTRY }}
          REPO: ${{ github.repository }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build & push image
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:${{ steps.tag.outputs.immutable }}
            ${{ steps.img.outputs.name }}:${{ steps.tag.outputs.moving }}
          cache-from: type=gha,scope=api-${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=api-${{ github.ref_name }}
