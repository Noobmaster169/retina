[project]
name = "retina-doc-extract"
version = "0.1.0"
description = "Turns a stored attachment into text, or into pixels for a model that can see"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "minio>=7.2",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "pillow>=10.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = [".", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "BLE"]
