# Local infrastructure for `pnpm dev`, `pnpm dev:worker` and the integration tests.
#
#   docker compose -f compose.local.yaml up -d
#   pnpm db:migrate
#
# Everything binds to loopback. Postgres is published on 5433 so it cannot
# collide with one already on 5432. The integration suite creates and uses
# `retina_test` in this instance.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: localdev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # AOF so queued jobs survive a restart. noeviction because BullMQ requires
  # it: under memory pressure Redis must refuse writes, not drop job keys.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction", "--maxmemory", "512mb"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: retina
      MINIO_ROOT_PASSWORD: retinaretina
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: quay.io/minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 retina retinaretina &&
                  mc mb --ignore-existing local/retina"

  # The Averis kit from ../emails: the inbox and the scorer. The answer key is
  # mounted here and nowhere else. Same service `docker compose up` in emails/
  # starts, so run one or the other, not both (they share port 8080).
  inbox:
    build: ../emails/server
    ports:
      - "127.0.0.1:8080:8000"
    volumes:
      - ../emails/data_v2:/data:ro
      - ../emails/data_v2/ground_truth.json:/secrets/ground_truth.json:ro
    environment:
      DATA_DIR: /data
      GROUND_TRUTH: /secrets/ground_truth.json

  # The 5,000-email synthetic inbox: the same server image with the other set
  # mounted, so it lists, serves attachments and scores at /submit exactly as the
  # organisers' does, against its own answer key. A run chooses it on the
  # new-run form; the api reaches it at EMAIL_SERVER_5K_URL.
  #
  # Behind a profile because the data is not in git (145 MB, and a key of its
  # own). Without ../emails/data_5k on this machine, leave the profile off and
  # the form simply does not offer it. With it:
  #
  #   docker compose -f compose.local.yaml --profile synthetic up -d
  #
  # REVEAL_GT opens the judge endpoint so the email-by-email view can grade a
  # run of it too; the port is on loopback only.
  inbox-5k:
    build: ../emails/server
    profiles: ["synthetic"]
    ports:
      - "127.0.0.1:8081:8000"
    volumes:
      - ../emails/data_5k:/data:ro
      - ../emails/data_5k/ground_truth.json:/secrets/ground_truth.json:ro
    environment:
      DATA_DIR: /data
      GROUND_TRUTH: /secrets/ground_truth.json
      REVEAL_GT: "1"

  # Retina's llm-proxy (../proxy), the one door to the models. Published on
  # host loopback 4001 for `pnpm dev` and the worker, which set
  # LLM_PROXY_URL=http://127.0.0.1:4001 (4000 is often another project's
  # proxy). The login is CLAUDE_CODE_OAUTH_TOKEN, which compose reads from
  # backend/.env; without it the proxy still starts and every Claude call is
  # refused as "not logged in". Rebuild after changing proxy/:
  #   docker compose -f compose.local.yaml up -d --build llm-proxy
  llm-proxy:
    build: ../proxy
    ports:
      - "127.0.0.1:4001:4000"
    environment:
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}

  # Retina's doc-extract (../services/doc-extract): every attachment becomes
  # text here, tesseract included. It reads and writes the bucket by key, so
  # bytes never pass through the worker. Published on host loopback 8000 for
  # the worker running under `pnpm dev:worker` (DOC_EXTRACT_URL). Rebuild
  # after changing services/doc-extract/:
  #   docker compose -f compose.local.yaml up -d --build doc-extract
  doc-extract:
    build: ../services/doc-extract
    # A guard, as on the box (deploy/compose.yaml explains the number). Docker
    # Desktop's VM is half the laptop's RAM by default and the proxy's twenty
    # `claude -p` sessions need several GB of it, so this stays well under.
    mem_limit: 8g
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: retina
      MINIO_SECRET_KEY: retinaretina
      MINIO_BUCKET: retina
    depends_on:
      minio:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  miniodata:
