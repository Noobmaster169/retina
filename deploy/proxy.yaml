# llm-proxy configuration for the Monash box. Copy to ~/retina/proxy.yaml.
#
# Two rails only: the Claude Code subscription (`claude -p`, logged in as the
# student user) and the box's own Ollama on loopback. No provider API keys
# live on this machine. The retina API on 8091 is the only caller and the
# only auth in front of this — the proxy authenticates nobody.

version: 1

server:
  host: 127.0.0.1          # loopback only. Never widen this: there is no auth.
  port: 4000
  request_timeout_s: 1800
  cors_origins: []

# OFF, deliberately. With it on, a streamed chat message could run a Claude
# Code session that executes code on this shared box.
agent:
  enabled: false

providers:
  claudecli:
    type: claudecli
    binary: claude
    max_concurrency: 2
    timeout_s: 1200
    stream_mode: native
    neutralise_anthropic_key: true

  ollama:
    type: openai_compatible
    base_url: http://127.0.0.1:11434/v1
    max_concurrency: 2
    # The only switch that turns Qwen 3's thinking off on this Ollama build.
    extra_body:
      reasoning_effort: none

  mock:
    type: mock

model_list:
  # Subscription rail.
  - model_name: default
    params: { model: claudecli/sonnet }
  - model_name: claude
    params: { model: claudecli/opus }
  - model_name: claude-fast
    params: { model: claudecli/haiku }

  # Local Qwen. Tags must match `docker exec monash-ollama ollama list`; the
  # -ctx16k profiles carry num_ctx=16384, without which Ollama silently
  # truncates at 4096.
  - model_name: qwen
    params: { model: ollama/qwen3:14b-ctx16k, max_tokens: 8000 }
  - model_name: qwen-small
    params: { model: ollama/qwen3:4b-ctx16k, max_tokens: 8000 }
  - model_name: qwen-large
    params: { model: ollama/qwen3.8:27b-ctx16k, max_tokens: 8000 }

  # Scripted, free, offline. For smoke tests.
  - model_name: test
    params: { model: mock/echo }

capabilities:
  "claudecli/*":
    sampling: deny
    tools: deny
    images: deny
    system: merge_into_first_user
  "ollama/*":
    sampling: allow
    thinking: none
    images: deny
    context_window: 16384

on_unsupported_param: strip_and_warn

budgets:
  enforcement: reserve
  # claudecli reports counterfactual cost; nothing is billed. Calls per hour is
  # the only cap that means anything on the subscription rail.
  claudecli:
    calls_per_hour: 120

cache:
  enabled: true
  ttl_s: 86400
  cache_streams: true
  scope: project
  skip_if: [has_tool_result, temperature_gt_0, stop_reason_error]

log:
  store_request_body: true
  store_response_body: true
  store_raw_provider: false
  retention_days: 30
