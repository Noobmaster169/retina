# The retina backend on the Monash server (student@118.139.133.14).
#
# Postgres, Redis, MinIO and the llm-proxy are private to this compose
# network. The API publishes 8091 on host loopback only: the ngrok tunnel is
# the single door in. Models go through retina's own llm-proxy (proxy/ in this
# repo), a service of this stack built from the clone and logged in to the
# Claude subscription by CLAUDE_CODE_OAUTH_TOKEN from .env.
#
# auto-deploy.sh copies this file to ~/retina/compose.yaml on every deploy, so
# a service added here reaches the box on the next cron tick. What it never
# copies is ~/retina/.env: a new secret has to be added there by hand, which
# deploy/bootstrap-wizard.sh does.
#
# Setup and day-to-day commands: README.md next to this file.

# api and worker run the same image against the same dependencies. One block so
# the two cannot drift; only what differs from config.ts's defaults is listed.
x-backend-env: &backend-env
  PG_HOST: postgres
  PG_PORT: "5432"
  PG_DATABASE: retina_prod
  PG_USER: retina
  PG_PASSWORD: ${PG_PASSWORD:?set PG_PASSWORD in .env}
  # The chat agent's read-only principal (migration 011). The api runs the
  # migrations before it listens, and 011 needs this to create the role, so a
  # deploy without it fails at boot rather than at the first question.
  PG_RO_PASSWORD: ${PG_RO_PASSWORD:?set PG_RO_PASSWORD in .env}
  DATABASE_RO_URL: postgres://retina_ro:${PG_RO_PASSWORD:?set PG_RO_PASSWORD in .env}@postgres:5432/retina_prod
  API_SHARED_SECRET: ${API_SHARED_SECRET:?set API_SHARED_SECRET in .env}
  TEAM_API_KEY: ${TEAM_API_KEY:?set TEAM_API_KEY in .env}
  REDIS_URL: redis://redis:6379
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY in .env}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY in .env}
  LLM_PROXY_URL: http://llm-proxy:4000
  DOC_EXTRACT_URL: http://doc-extract:8000
  EMAIL_SERVER_URL: http://inbox:8000

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: retina_prod
      POSTGRES_USER: retina
      POSTGRES_PASSWORD: ${PG_PASSWORD:?set PG_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retina -d retina_prod"]
      interval: 5s
      timeout: 5s
      retries: 10

  # AOF so queued jobs survive a restart. noeviction because BullMQ requires
  # it: under memory pressure Redis must refuse writes, not drop job keys.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction", "--maxmemory", "512mb"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Attachment bytes, one copy per run. No published port: the console is
  # reachable only through an SSH tunnel, see README.md.
  minio:
    image: quay.io/minio/minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY in .env}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Runs once per `up` and exits. The worker also ensures the bucket at boot;
  # this is what makes it exist for the api, which only reads.
  minio-init:
    image: quay.io/minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY} ${MINIO_SECRET_KEY} &&
                  mc mb --ignore-existing local/retina"

  # The model gateway: proxy/ from the clone, driving `claude -p`. No published
  # port: it authenticates nobody, so only this network may reach it. The token
  # is optional here on purpose: without it the stack still comes up and every
  # model call fails fast as "not logged in", the same way a missing MinIO
  # degrades /health rather than blocking a deploy. auto-deploy.sh rebuilds it
  # when proxy/ changes.
  #
  # A request carrying an image is served by writing it to a private temporary
  # directory inside this container and letting the CLI's own Read tool open it,
  # scoped to that directory and nothing else. So the container needs a writable
  # /tmp, which it has: do not add `read_only: true` here without a
  # `tmpfs: [/tmp]` beside it, or every scanned document stops being readable.
  # Nothing else about this service changed for images.
  llm-proxy:
    build: ../projects/retina/proxy
    restart: unless-stopped
    environment:
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}

  # The parser: services/doc-extract from the clone. It reads attachments from
  # MinIO by key and writes back the pixels it could not turn into text, so the
  # worker never carries file bytes and nothing here recognises characters. No
  # published port: only the worker calls it. auto-deploy.sh rebuilds it when
  # services/doc-extract/ changes.
  #
  # The memory cap is a guard against a runaway file, not a sizing. It was 1g,
  # which the service outgrew at 8 pages at once (measured: OOM-killed) back when
  # it ran OCR; drawing a page is far lighter than reading one, and four worker
  # processes carry about 0.4 GB each, so 8g is now generous. CPU is deliberately
  # not capped: capped, an overloaded service got slower, not just saturated.
  doc-extract:
    build: ../projects/retina/services/doc-extract
    restart: unless-stopped
    mem_limit: 8g
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY in .env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY in .env}
      MINIO_BUCKET: retina
    depends_on:
      minio:
        condition: service_healthy

  # The email server: emails/server from the clone, serving emails/data_v2.
  # Private to this network; the API is the only thing that reads it. The
  # answer key is mounted here and into nothing else.
  #
  # REVEAL_GT turns on the organisers' own judge endpoint, GET /ground_truth,
  # so the api can score a run here as well as send it to /submit. This service
  # publishes no port, so that endpoint is reachable from this network and from
  # nowhere else. JUDGE_TOKEN guards it anyway where .env names one; left empty
  # the server skips the check, which keeps a deploy from failing over a secret
  # that auto-deploy.sh cannot copy.
  inbox:
    build: ../projects/retina/emails/server
    restart: unless-stopped
    volumes:
      - ../projects/retina/emails/data_v2:/data:ro
      - ../projects/retina/emails/data_v2/ground_truth.json:/secrets/ground_truth.json:ro
    environment:
      DATA_DIR: /data
      GROUND_TRUTH: /secrets/ground_truth.json
      REVEAL_GT: "1"
      JUDGE_TOKEN: ${EVAL_JUDGE_TOKEN:-}

  api:
    image: ghcr.io/noobmaster169/retina-api:main
    restart: unless-stopped
    ports:
      - "127.0.0.1:8091:8091"
    environment:
      <<: *backend-env
      PORT: "8091"
      # Deliberately not in x-backend-env: the eval harness is reached through
      # the api's routes and its CLIs, never from a queue, so the worker has no
      # use for the answer key and is not given a way to it.
      EVAL_GROUND_TRUTH_URL: http://inbox:8000/ground_truth
      EVAL_JUDGE_TOKEN: ${EVAL_JUDGE_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      inbox:
        condition: service_started
    healthcheck:
      # /health is 200 when Postgres is reachable, whatever else is degraded,
      # and 503 when it is not. start_period covers the migrations, which run
      # before the process listens: without it a slow migration is read as a
      # dead container.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8091/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 45s

  # Queue consumers. The image has no build step, so it runs TypeScript through
  # tsx exactly as `pnpm start:worker` does.
  #
  # service_started, not service_healthy. Only the api migrates (its CMD does;
  # this command replaces it), so there is no race to order around, and the
  # worker touches Postgres when a job arrives rather than at boot. Waiting on
  # the api's health instead couples the two: a deploy whose api is unhealthy
  # aborts the whole `up` and leaves the worker down, which is what a rehearsed
  # rollback caught when there was one to rehearse it in.
  worker:
    image: ghcr.io/noobmaster169/retina-api:main
    restart: unless-stopped
    command: ["node", "--import", "tsx", "src/worker.ts"]
    environment:
      <<: *backend-env
    depends_on:
      api:
        condition: service_started
      llm-proxy:
        condition: service_started
      doc-extract:
        condition: service_started

volumes:
  pgdata:
  redisdata:
  miniodata:
