# The retina backend on the Monash server (student@118.139.133.14).
#
# Postgres is private to this compose network. The API publishes 8091 on host
# loopback only — the ngrok tunnel is the single door in. Models go through
# retina's own llm-proxy (proxy/ in this repo), run on the host by
# run-proxy.sh on the Docker bridge address, port 4001, which
# `host.docker.internal` resolves to from here. yt-engine's proxy is on 4000.
#
# Setup and day-to-day commands: README.md next to this file.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: retina_prod
      POSTGRES_USER: retina
      POSTGRES_PASSWORD: ${PG_PASSWORD:?set PG_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retina -d retina_prod"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/noobmaster169/retina-api:main
    restart: unless-stopped
    ports:
      - "127.0.0.1:8091:8091"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: "8091"
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DATABASE: retina_prod
      PG_USER: retina
      PG_PASSWORD: ${PG_PASSWORD:?set PG_PASSWORD in .env}
      API_SHARED_SECRET: ${API_SHARED_SECRET:?set API_SHARED_SECRET in .env}
      TEAM_API_KEY: ${TEAM_API_KEY:?set TEAM_API_KEY in .env}
      LLM_PROXY_URL: http://host.docker.internal:4001
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8091/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
